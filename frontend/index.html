<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1523" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <title>ROSKYRO — Healthcare Concierge | Verified Care, On Call</title>
    <meta name="description" content="ROSKYRO is a Healthcare Concierge — background-verified, trained care partners for elder care, hospital assistance and urgent support. Book in minutes, pay after the visit." />
    <link rel="manifest" href="/manifest.json" />

    <!-- Base Open Graph / Twitter tags so ANY page (including ones not
         prerendered per-route) shows consistent "ROSKYRO — Healthcare
         Concierge" branding when opened directly or shared on social /
         messaging apps. Per-page values are overridden client-side by
         useSEO.js, and fully replaced at build time for prerendered
         routes by scripts/prerender.mjs. -->
    <meta property="og:site_name" content="ROSKYRO — Healthcare Concierge" />
    <meta property="og:title" content="ROSKYRO — Healthcare Concierge | Verified Care, On Call" />
    <meta property="og:description" content="ROSKYRO is a Healthcare Concierge — background-verified, trained care partners for elder care, hospital assistance and urgent support." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://roskyro.in/brand/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ROSKYRO — Healthcare Concierge | Verified Care, On Call" />
    <meta name="twitter:description" content="ROSKYRO is a Healthcare Concierge — background-verified, trained care partners for elder care, hospital assistance and urgent support." />
    <meta name="apple-mobile-web-app-title" content="ROSKYRO" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
