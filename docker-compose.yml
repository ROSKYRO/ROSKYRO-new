version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: roskyro
      POSTGRES_PASSWORD: roskyro
      POSTGRES_DB: roskyro
    volumes:
      - roskyro_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://roskyro:roskyro@db:5432/roskyro
      SECRET_KEY: change-this-in-production
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  roskyro_db_data:
